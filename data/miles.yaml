# Metro Miles earning rules (concept demo; miles have no cash value).
# Tweak here, no code changes needed. Every award becomes one miles_ledger row with a human-readable reason.
# Calibrated 2026-10-23 (option C): plan.md's 5/km made a heavy commuter (~1,200 km/month) earn ~10k miles,
# i.e. five free day passes a month. These values give ~2,400/month: about one day pass or a few chais.

base_per_km: 1            # miles per km travelled (route distance)

off_peak:
  multiplier: 2           # base miles are multiplied outside peak hours, to nudge riders to spread out demand
  weekday_peaks:          # [start, end) local time, Monday-Friday; weekends are entirely off-peak
    - ["08:00", "11:00"]
    - ["17:00", "20:00"]

first_visit_bonus: 25     # per station visited for the first time (origin, destination or interchange)

streak:
  from_day: 3             # bonus starts on the 3rd consecutive day with a trip
  bonus: 10               # once per day, on that day's first trip

arrival_bonus: 10         # once per trip, when the traveller taps "I've reached"
