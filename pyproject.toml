[project]
name = "agla-station"
version = "0.1.0"
description = "Telegram bot for the Delhi NCR metro: routes, fares, Metro Miles, journey sharing and safety checks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1.0",
    "mcp==2.3.0",
    "networkx>=3.6.1",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "python-telegram-bot[job-queue]>=22.8",
    "pyyaml>=6.0.3",
    "qrcode[pil]>=8.2",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
# Not installed as a package: run from the project root (python -m ...). Avoids macOS hiding the editable .pth.
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".claude", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
